[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-lab"
version = "0.1.0"
description = "Macro-regime-aware portfolio analytics toolkit (MSCI factor/region study)"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1", "pdfplumber>=0.10", "certifi>=2023.0", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
